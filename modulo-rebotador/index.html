<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rebotador</title>
<link rel="stylesheet" href="../css/estilos.css">
<link rel="stylesheet" href="rebotador.css">
</head>
<body>
<div class="app-wrapper">
<header class="app-header"><h1>Rebotador</h1><p>Control de vehículos</p></header>
<div class="container">
<div class="card">
<h2>Cargar Excel</h2>
<div class="fila-acciones">
    <input type="file" id="excelFile" accept=".xlsx,.xls">
    <button class="btn-success" onclick="cargarExcel()">Cargar</button>
    <button onclick="volverEscaner()">Volver al Escaner</button>
</div>
<hr>
<div class="fila-selectores">
    <div>
        <label>Playa</label>
        <select id="playa"></select>
    </div>

    <div>
        <label>Bloque</label>
        <select id="bloque"></select>
    </div>
</div>
<div id="reader"></div>
<input id="manual" placeholder="Ingresar TB204626">
<button class="btn-success" onclick="buscarManual()">Buscar</button>
<div id="lista"></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="config_excel.js"></script>
<script src="rebotador.js"></script>
</body></html>
